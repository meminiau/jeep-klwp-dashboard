name: Build Jeep HUD KLWP APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify bundled KLWP preset asset
        run: |
          test -f app/src/main/assets/wallpapers/Jeep_HUD_Dashboard.klwp
          unzip -t app/src/main/assets/wallpapers/Jeep_HUD_Dashboard.klwp

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/jeep-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias jeepdash \
            -storepass jeepklwpdash \
            -keypass jeepklwpdash \
            -dname "CN=Jeep HUD KLWP, OU=Automotive, O=JeepDash, L=Sydney, S=NSW, C=AU"

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: /tmp/jeep-release.jks
          RELEASE_KEYSTORE_PASSWORD: jeepklwpdash
          RELEASE_KEY_ALIAS: jeepdash
          RELEASE_KEY_PASSWORD: jeepklwpdash
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package metadata
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk
          cp app/src/main/assets/wallpapers/Jeep_HUD_Dashboard.klwp dist/Jeep_HUD_Dashboard.klwp
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeep-hud-klwp-apk
          path: |
            dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk
            dist/Jeep_HUD_Dashboard.klwp

      - name: Publish GitHub Release with Installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Jeep HUD KLWP Dashboard v1.0.0
          body: |
            Installable Android APK for Jeep portrait stereos featuring:
            - **Cleaned & cropped KLWP HUD wallpaper** (bottom climate control bar removed; live clock, date, and dynamic cyan active button highlight)
            - **6 interactive sidebar buttons**: **Gemini Voice** (above Torque), **Torque**, **Jellyfin**, **Waze**, **YouTube**, and **YouTube Music**
            - **Floating Apps (LWi s.r.o.) & Android Freeform Window integration** aligned to the right-hand HUD window frame
            - **Automatic Audio Glow Music Visualizer launch** whenever YouTube Music opens
          files: |
            dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk
            dist/Jeep_HUD_Dashboard.klwp
