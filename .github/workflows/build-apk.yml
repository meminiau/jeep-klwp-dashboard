name: Build Jeep HUD Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses & ensure API 34
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/jeep-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias jeepdash \
            -storepass jeepklwpdash \
            -keypass jeepklwpdash \
            -dname "CN=Jeep HUD Launcher, OU=Automotive, O=JeepDash, L=Sydney, S=NSW, C=AU"

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: /tmp/jeep-release.jks
          RELEASE_KEYSTORE_PASSWORD: jeepklwpdash
          RELEASE_KEY_ALIAS: jeepdash
          RELEASE_KEY_PASSWORD: jeepklwpdash
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package metadata
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/Jeep-HUD-Launcher-v2.0.0.apk
          cp "$APK_PATH" dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeep-hud-launcher-apk
          path: |
            dist/Jeep-HUD-Launcher-v2.0.0.apk
            dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk

      - name: Publish GitHub Release with Installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Jeep HUD Launcher v2.0.0
          body: |
            Standalone full-screen Android Home Launcher APK for Jeep portrait stereos (no KLWP required):
            - **Full-Screen Live Jeep HUD Home Launcher** (`CATEGORY_HOME` / `CATEGORY_DEFAULT` with `singleTask`, `stateNotNeeded`, `clearTaskOnLaunch`)
            - **Live Clock, Date & Status Readout** over the cleaned Jeep cyber HUD background (bottom climate control bar removed)
            - **6 Interactive Sidebar Buttons**: **Gemini Voice** (above Torque), **Torque**, **Jellyfin**, **Waze**, **YouTube**, and **YouTube Music** with dynamic cyan highlight & rail pointer
            - **Built-In Swipe-Up App Drawer** listing all installed Android apps (tap to launch, long-press to launch inside the HUD window)
            - **Discreet Top-Right Settings Gear** opening `SettingsActivity` (`Link FA` Floating Apps shortcuts, `Enable Background YouTube Music Monitor`, `Default Assistant`, and HUD window calibration)
            - **Floating Apps (`com.lwi.android.flapps`) & Android Freeform Window integration** + **Automatic Audio Glow Music Visualizer** whenever YouTube Music opens
          files: |
            dist/Jeep-HUD-Launcher-v2.0.0.apk
            dist/Jeep-HUD-KLWP-Dashboard-v1.0.0.apk
